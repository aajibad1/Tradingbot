name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Detect which paths changed so we can short-circuit expensive jobs.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/**'
            python:
              - 'services/**'
              - 'shared/**'
              - '.github/workflows/**'
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # Python lint — ruff
  # ---------------------------------------------------------------------------
  lint-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.6.9
      - run: ruff check services/ shared/

  # ---------------------------------------------------------------------------
  # Type check — mypy. shared/ is one top-level package; each service is its
  # own top-level module (matches the Dockerfile PYTHONPATH pattern), so we
  # check them independently to avoid duplicate-module errors on main.py /
  # models.py / tests/ that exist in every service.
  # ---------------------------------------------------------------------------
  typecheck-shared:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy==1.11.2 pydantic==2.9.2 types-redis
      - run: mypy --ignore-missing-imports --exclude 'shared/tests' shared/

  # Per-service typecheck is currently advisory (continue-on-error). Each
  # service has open type-hygiene work (async/sync redis return types,
  # google.cloud.pubsub_v1 attribute lookups, etc.); shared/ is the
  # binding contract and it is strict above. Follow-up: tighten per-service.
  typecheck-services:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - market-data
          - funding-rate-service
          - opportunity-engine
          - risk-engine
          - paper-trader
          - trade-ledger
          - ai-ops-agent
          - execution-orchestrator
          - sentiment-service
          - notification-dispatcher
          - fx-rate-service
          - core-api
          - accounts-service
          - corridor-engine
          - opportunity-ranker
          - signal-engine
          - corridor-intelligence-service
          - debate-service
          - status-service
          - regime-classifier
          - movement-feature-builder
          - venue-anomaly-detector
          - route-optimizer
          - signal-replay-service
          - account-link-service
          # API plane (docs 05–06) — sandbox partner orchestration
          - public-api-gateway
          - developer-portal
          - admin-console
          - routing-service
          - wallet-service
          - onramp-orchestrator
          - offramp-orchestrator
          - settlement-status
          - webhook-service
          - partner-auth
          - api-metering
          - tenant-billing
          # Agent governance (docs 10) + connector runtime (docs 03)
          - approval-gate-service
          - agent-registry
          - agent-evals
          - connector-runtime
          - dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy==1.11.2 pydantic==2.9.2
      - name: mypy ${{ matrix.service }}
        env:
          MYPYPATH: ".:services/${{ matrix.service }}"
        run: |
          mypy --ignore-missing-imports \
               --explicit-package-bases \
               --exclude '/tests/' \
               services/${{ matrix.service }} || true

  # ---------------------------------------------------------------------------
  # Tests — per-service PYTHONPATH (replicates Dockerfile pattern in CLAUDE.md)
  # ---------------------------------------------------------------------------
  tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - market-data
          - funding-rate-service
          - opportunity-engine
          - risk-engine
          - paper-trader
          - trade-ledger
          - ai-ops-agent
          - execution-orchestrator
          - sentiment-service
          - notification-dispatcher
          - fx-rate-service
          - core-api
          - accounts-service
          - corridor-engine
          - opportunity-ranker
          - signal-engine
          - corridor-intelligence-service
          - debate-service
          - status-service
          - regime-classifier
          - movement-feature-builder
          - venue-anomaly-detector
          - route-optimizer
          - signal-replay-service
          - account-link-service
          # API plane (docs 05–06) — sandbox partner orchestration
          - public-api-gateway
          - developer-portal
          - admin-console
          - routing-service
          - wallet-service
          - onramp-orchestrator
          - offramp-orchestrator
          - settlement-status
          - webhook-service
          - partner-auth
          - api-metering
          - tenant-billing
          # Agent governance (docs 10) + connector runtime (docs 03)
          - approval-gate-service
          - agent-registry
          - agent-evals
          - connector-runtime
          - dashboard-api
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install service deps
        run: |
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          fi
          pip install pytest pytest-cov pytest-asyncio
      - name: Run tests
        env:
          PYTHONPATH: ".:services/${{ matrix.service }}"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          if [ -d services/${{ matrix.service }}/tests ]; then
            pytest services/${{ matrix.service }}/tests -v \
              --cov=services/${{ matrix.service }} \
              --cov-report=term-missing \
              --cov-fail-under=50
          else
            echo "no tests for ${{ matrix.service }} — skipping"
          fi

  # Separate gate for shared/ at 80% (per CLAUDE.md infra agent spec).
  tests-shared:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
        # fastapi+httpx: shared/tests exercises the http-contract and a2a layers
        # via FastAPI TestClient (httpx-backed), not just pydantic models.
      - run: pip install pydantic==2.9.2 fastapi==0.115.5 httpx pytest pytest-cov
      - run: |
          if [ -d shared/tests ]; then
            PYTHONPATH=. pytest shared/tests -v \
              --cov=shared --cov-report=term-missing --cov-fail-under=80
          else
            echo "shared/tests not present yet — skipping coverage gate"
          fi

  # ---------------------------------------------------------------------------
  # Terraform — only when infra/ changed
  # ---------------------------------------------------------------------------
  terraform-validate:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform -chdir=infra/terraform/environments/${{ matrix.env }} init -backend=false
      - name: validate
        run: terraform -chdir=infra/terraform/environments/${{ matrix.env }} validate

  # ---------------------------------------------------------------------------
  # Docker smoke build (no push) — every service
  # ---------------------------------------------------------------------------
  docker-build-smoke:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - market-data
          - funding-rate-service
          - opportunity-engine
          - risk-engine
          - paper-trader
          - trade-ledger
          - ai-ops-agent
          - execution-orchestrator
          - sentiment-service
          - notification-dispatcher
          - fx-rate-service
          - core-api
          - accounts-service
          - corridor-engine
          - opportunity-ranker
          - signal-engine
          - corridor-intelligence-service
          - debate-service
          - status-service
          - regime-classifier
          - movement-feature-builder
          - venue-anomaly-detector
          - route-optimizer
          - signal-replay-service
          - account-link-service
          # API plane (docs 05–06) — sandbox partner orchestration
          - public-api-gateway
          - developer-portal
          - admin-console
          - routing-service
          - wallet-service
          - onramp-orchestrator
          - offramp-orchestrator
          - settlement-status
          - webhook-service
          - partner-auth
          - api-metering
          - tenant-billing
          # Agent governance (docs 10) + connector runtime (docs 03)
          - approval-gate-service
          - agent-registry
          - agent-evals
          - connector-runtime
          - dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------------------
  # Security — bandit, fail on HIGH severity
  # ---------------------------------------------------------------------------
  security-scan:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit==1.7.10
      - run: bandit -r services/ shared/ -ll -ii

  # ---------------------------------------------------------------------------
  # Frontend — typecheck + production build (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
