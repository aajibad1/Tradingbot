name: Deploy

# Deploys are run from the CLI, NOT from GitHub Actions. On push this workflow
# only builds + pushes images (so Artifact Registry always has a fresh image to
# `terraform apply` against locally). The terraform-apply-prod job is gated to
# manual `workflow_dispatch` only — no push ever auto-applies to prod.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: commit SHA)"
        required: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: agenuit
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: crypto-arb

jobs:
  # ---------------------------------------------------------------------------
  # Build + push images for every service
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every service listed below has a Dockerfile checked in. The matrix
        # is the canonical "what we deploy" list — keep it aligned with the
        # services/ directory contents.
        service:
          - market-data
          - funding-rate-service
          - opportunity-engine
          - risk-engine
          - paper-trader
          - trade-ledger
          - ai-ops-agent
          - execution-orchestrator
          - sentiment-service
          - dashboard-api
          - notification-dispatcher
          - fx-rate-service
          # Control plane (multi-tenant SaaS) — Postgres-backed; need Cloud SQL
          # + DATABASE_URL wired in terraform before they can actually deploy.
          - core-api
          - accounts-service
          - account-link-service
          - corridor-engine
          - opportunity-ranker
          - signal-engine
          - corridor-intelligence-service
          - debate-service
          - status-service
          - regime-classifier
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------------------
  # Frontend image (apps/frontend/Dockerfile — outside the services/ matrix)
  # ---------------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/frontend:${{ github.event.inputs.image_tag || github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---------------------------------------------------------------------------
  # Terraform apply — gated by the "production" GitHub Environment
  # (manual approval lives in that environment's protection rules)
  # ---------------------------------------------------------------------------
  terraform-apply-prod:
    needs: build-and-push
    # Manual-only: prod is deployed from the CLI (`terraform apply` in
    # infra/terraform/environments/prod). This job runs solely on an explicit
    # workflow_dispatch, never on push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: init
        working-directory: infra/terraform/environments/prod
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - name: plan
        working-directory: infra/terraform/environments/prod
        run: terraform plan -var "image_tag=${{ needs.build-and-push.outputs.image_tag }}" -out=tfplan
      - name: apply
        working-directory: infra/terraform/environments/prod
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Slack notification — runs after the deploy whether it succeeded or failed.
  # Soft-fails if SLACK_WEBHOOK_URL is unset (the step prints a notice
  # rather than failing the workflow).
  # ---------------------------------------------------------------------------
  notify:
    needs: [build-and-push, terraform-apply-prod]
    runs-on: ubuntu-latest
    # Only relevant for an actual deploy (manual dispatch); skip on plain pushes
    # where no terraform-apply runs.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Post deploy status to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          TF_RESULT: ${{ needs.terraform-apply-prod.result }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi
          STATUS="success"
          if [ "$BUILD_RESULT" != "success" ] || [ "$TF_RESULT" != "success" ]; then
            STATUS="failure"
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Deploy ${STATUS} (build=${BUILD_RESULT}, terraform=${TF_RESULT}) — ${SHA}\"}" \
            "${SLACK_WEBHOOK_URL}"
